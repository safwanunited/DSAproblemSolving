spring.application.name=productservice

fakestore.api.url=https://fakestoreapi.com
fakestore.api.path.product=/product
server.port=8082

# Uncomment the following lines to use a local MySQL database
#spring.datasource.url=jdbc:mysql://localhost:3306/myappdb
#spring.datasource.username=root
#spring.datasource.password=
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.datasource.url=jdbc:mysql://productservicedb.c14uug8i6nj5.ap-south-1.rds.amazonaws.com:3306/productservicedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=productservicedb
spring.datasource.password=productservicedb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [traceId=%X{traceId:-none}] [spanId=%X{spanId:-none}] %msg%n